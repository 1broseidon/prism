[package]
name = "prism-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Prism system-tray MCP gateway"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
prism-core = { path = "../../../crates/prism-core" }
tauri = { version = "2.11", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2.4"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-updater = "2.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1.47", features = ["macros", "time"] }
chrono = "0.4"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "env-filter"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
