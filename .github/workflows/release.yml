name: release

# Tag a release with `vX.Y.Z` (or run manually against an existing tag). The tag must match the
# version in Cargo.toml, tauri.conf.json and package.json; the bump lives in one commit before the tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TAG="${{ inputs.tag }}"; else TAG="${GITHUB_REF#refs/tags/}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
      - name: Versions agree with the tag
        run: |
          V="${{ steps.tag.outputs.version }}"
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          TAURI=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          PKG=$(jq -r .version apps/desktop/package.json)
          echo "tag=$V cargo=$CARGO tauri=$TAURI package=$PKG"
          [ "$V" = "$CARGO" ] && [ "$V" = "$TAURI" ] && [ "$V" = "$PKG" ] || { echo "version mismatch" >&2; exit 1; }
      - name: Changelog has an entry
        run: |
          V="${{ steps.tag.outputs.version }}"
          grep -q "^## \[$V\]" CHANGELOG.md || { echo "Add a \"## [$V]\" section to CHANGELOG.md before tagging." >&2; exit 1; }

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            os: darwin
            arch: arm64
          - runner: macos-latest
            target: x86_64-apple-darwin
            os: darwin
            arch: x86_64
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os: linux
            arch: x86_64
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            os: linux
            arch: arm64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            os: windows
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.target }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libdbus-1-dev libssl-dev libxdo-dev pkg-config build-essential file

      - name: Frontend deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Test core
        if: matrix.arch != 'x86_64' || matrix.os != 'darwin'
        run: cargo test -p prism-core --locked

      # Signing and notarization are optional and independent. APPLE_CERTIFICATE (base64 p12) with
      # its password and identity signs; the App Store Connect API key notarizes. Variables are
      # exported only when the secrets exist: Tauri treats an empty APPLE_CERTIFICATE as a
      # certificate and fails to import it. Without a certificate the bundle is ad-hoc signed.
      - name: Apple signing secrets
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
              echo "::add-mask::${!name}"
              echo "$name=${!name}" >> "$GITHUB_ENV"
            done
            echo "Signing as: $APPLE_SIGNING_IDENTITY"
          else
            # Tauri skips codesign entirely without an identity, and an unsigned bundle shows as
            # "damaged" on Apple silicon. "-" ad-hoc signs, which downgrades that to the
            # "unidentified developer" dialog that right-click > Open can pass.
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "No Developer ID certificate; bundle will be ad-hoc signed."
          fi
          if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_CERTIFICATE" ]; then
            keypath="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$keypath"
            chmod 600 "$keypath"
            echo "APPLE_API_KEY=$APPLE_API_KEY" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_PATH=$keypath" >> "$GITHUB_ENV"
            echo "Notarizing with API key $APPLE_API_KEY."
          else
            echo "Not notarizing."
          fi

      # The updater key signs every bundle (minisign). Without it `createUpdaterArtifacts` fails
      # the build, so the release cannot ship unsigned update files by accident.
      - name: Build bundles
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }} --ci

      - name: Collect and rename
        run: |
          V="${{ needs.verify.outputs.version }}"
          B="target/${{ matrix.target }}/release/bundle"
          OUT=out; mkdir -p "$OUT"
          S="${{ matrix.os }}_${{ matrix.arch }}"
          # take <glob> <name>: copies the bundle and its updater signature under the release name.
          take() { cp "$1" "$OUT/$2"; cp "$1.sig" "$OUT/$2.sig"; }
          case "${{ matrix.os }}" in
            darwin)
              cp "$B"/dmg/*.dmg "$OUT/prism_${V}_${S}.dmg"
              take "$B"/macos/Prism.app.tar.gz "prism_${V}_${S}.app.tar.gz"
              ;;
            linux)
              take "$B"/appimage/*.AppImage "prism_${V}_${S}.AppImage"
              take "$B"/deb/*.deb "prism_${V}_${S}.deb"
              take "$B"/rpm/*.rpm "prism_${V}_${S}.rpm"
              ;;
            windows)
              take "$B"/msi/*.msi "prism_${V}_${S}.msi"
              take "$B"/nsis/*-setup.exe "prism_${V}_${S}-setup.exe"
              ;;
          esac
          ls -la "$OUT"

      - uses: actions/upload-artifact@v7
        with:
          name: prism_${{ matrix.os }}_${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum $(ls prism_* | grep -v '\.sig$') > checksums.txt && cat checksums.txt
      - name: Release notes from changelog
        run: |
          V="${{ needs.verify.outputs.version }}"
          awk -v v="$V" '/^## \[/ { if (on) exit; if (index($0, "## [" v "]") == 1) { on = 1; next } } on { print }' CHANGELOG.md \
            | sed '/./,$!d' > dist/notes.md
          awk 'NF { f = 1 } END { exit f ? 0 : 1 }' dist/notes.md || { echo "empty changelog section for $V" >&2; exit 1; }
      # latest.json is what installed copies poll. Keys are the updater's `{os}-{arch}` with an
      # optional `-{installer}` suffix; the bare key is the fallback for that platform.
      - name: Update manifest
        run: |
          V="${{ needs.verify.outputs.version }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${{ needs.verify.outputs.tag }}"
          entry() {  # entry <platform key> <file>
            [ -f "dist/$2.sig" ] || { echo "missing signature for $2" >&2; exit 1; }
            jq -n --arg k "$1" --arg u "$BASE/$2" --arg s "$(cat "dist/$2.sig")" '{($k): {url: $u, signature: $s}}'
          }
          {
            entry darwin-aarch64       "prism_${V}_darwin_arm64.app.tar.gz"
            entry darwin-x86_64        "prism_${V}_darwin_x86_64.app.tar.gz"
            entry linux-x86_64         "prism_${V}_linux_x86_64.AppImage"
            entry linux-x86_64-deb     "prism_${V}_linux_x86_64.deb"
            entry linux-x86_64-rpm     "prism_${V}_linux_x86_64.rpm"
            entry linux-aarch64        "prism_${V}_linux_arm64.AppImage"
            entry linux-aarch64-deb    "prism_${V}_linux_arm64.deb"
            entry linux-aarch64-rpm    "prism_${V}_linux_arm64.rpm"
            entry windows-x86_64       "prism_${V}_windows_x86_64-setup.exe"
            entry windows-x86_64-nsis  "prism_${V}_windows_x86_64-setup.exe"
            entry windows-x86_64-msi   "prism_${V}_windows_x86_64.msi"
          } | jq -s 'add' > dist/platforms.json
          jq -n --arg v "$V" --rawfile notes dist/notes.md --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile p dist/platforms.json \
            '{version: $v, notes: $notes, pub_date: $date, platforms: $p[0]}' > dist/latest.json
          jq '.platforms | keys' dist/latest.json
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: Prism ${{ needs.verify.outputs.tag }}
          body_path: dist/notes.md
          files: |
            dist/prism_*
            dist/checksums.txt
            dist/latest.json
