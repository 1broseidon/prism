<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Prism · Sign-in</title>
<style>
  :root {
    color-scheme: light dark;
    --paper: light-dark(#f8f7f4, #24211e);
    --ink: light-dark(#252820, #f3f3ec);
    --muted: light-dark(#62695c, #b9c0b1);
    --green: light-dark(#287344, #8aca9d);
    --danger: light-dark(#a33b30, #efa49a);
    --amber: light-dark(#805817, #d6b66a);
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center;
    padding: 32px 24px; background: var(--paper); color: var(--ink);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { width: 100%; max-width: 28rem; text-align: center; }
  body { --signal: var(--muted); }
  body[data-state="waiting"] { --signal: var(--amber); }
  body[data-state="done"], body[data-state="inprogress"] { --signal: var(--muted); }
  body[data-state="failed"], body[data-state="refused"] { --signal: var(--danger); }
  body[data-state="ok"] { --signal: var(--green); }
  .mark { display: block; width: 64px; height: 51px; margin: 0 auto 28px; color: var(--signal); }
  .facet { opacity: .65; }
  .eyebrow { color: var(--signal); font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; }
  h1 { margin: 10px 0 14px; font-size: clamp(26px, 5vw, 32px); line-height: 1.2; letter-spacing: -.025em; font-weight: 600; }
  p { margin: 0; color: var(--muted); overflow-wrap: anywhere; }
  b { color: var(--ink); font-weight: 600; }
  .close, noscript { display: block; margin-top: 24px; font-size: 14px; }
</style>
</head>
<body data-state="{{state}}">
<main aria-live="polite">
  <svg class="mark" viewBox="8 12 48 38" aria-hidden="true" fill="currentColor">
    <polygon points="8,50 30,12 38,50" />
    <polygon class="facet" points="42,50 30,12 52,18 56,50" />
  </svg>
  <div class="eyebrow {{eyebrow_class}}">{{eyebrow}}</div>
  <h1>{{title}}</h1>
  <p class="lede">{{lede}}</p>
  <p class="close">{{footer}}</p>
</main>
{{script}}
</body>
</html>
